[package]
name = "bigrag-native"
version = "1.0.0"
edition = "2021"
description = "Native Rust performance module for BigRAG plugin"
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"

# Current dependencies
sha2 = "0.10"
rayon = "1.10"
walkdir = "2.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Tokenizer for accurate token counting (cl100k_base for nomic-embed-text-v1.5)
tiktoken-rs = "0.6"

# PDF parsing
lopdf = "0.31"

# EPUB parsing
epub = "2.0"

# HTML parsing (for EPUB and text processing)
scraper = "0.19"

# Markdown parsing
pulldown-cmark = "0.10"

# Regex for text processing
regex = "1.10"
lazy_static = "1.4"

# Image processing and OCR
image = "0.25"
tesseract = "0.15"

# Vector operations
ndarray = "0.15"

# Async runtime for batch operations
tokio = { version = "1.0", features = ["full"] }

# HTTP client for LM Studio API (indexer)
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"

# Note: LanceDB deferred - requires protobuf-compiler
# Use vectra (TypeScript) for vector store for now
# lancedb = "0.4"
# arrow-array = "48"
# arrow-schema = "48"
# arrow-buffer = "48"
# arrow-data = "48"
# arrow-arith = "48"

[patch.crates-io]
# Force chrono version to avoid arrow conflict
chrono = { version = "0.4.31", git = "https://github.com/chronotope/chrono", tag = "v0.4.31" }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
